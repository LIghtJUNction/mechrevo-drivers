[package]
name = "mechrevo-console-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
windows-fnlock-candidate = ["mechrevo-console-core/windows-fnlock-candidate"]

[[bin]]
name = "mechrevo-console"
path = "src/main.rs"

[[bin]]
name = "mechrevo-console-oem-helper"
path = "src/oem_helper.rs"

[[bin]]
name = "mechrevo-console-fan-helper"
path = "src/fan_helper.rs"

[dependencies]
mechrevo-console-core = { path = "../core" }
serde_json.workspace = true
