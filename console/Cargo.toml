[workspace]
members = ["crates/core", "crates/cli", "crates/gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
rust-version = "1.99.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zclap = { git = "https://github.com/LIghtJUNction/zclap.git" }
zhex = { git = "https://github.com/LIghtJUNction/zhex.git" }
z64 = { git = "https://github.com/LIghtJUNction/z64.git" }
